<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AFTERFALL</title>
    <meta name="description" content="O mundo acabou. Sua jornada continua. Guia cronológico não oficial do universo televisivo de The Walking Dead." />
    <meta name="theme-color" content="#0e0f0f" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AFTERFALL" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <script>
      // Aplica o tema salvo antes da primeira pintura (evita flash).
      try {
        var t = localStorage.getItem('afterfall:theme');
        if (t === 'light' || (t === 'system' && matchMedia('(prefers-color-scheme: light)').matches)) {
          document.documentElement.dataset.theme = 'light';
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>O AFTERFALL precisa de JavaScript para funcionar.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
